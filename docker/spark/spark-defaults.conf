# Cấu hình mặc định cho mọi Spark application chạy trong container.

# Spark là HDFS *client*: số bản sao khi Spark GHI file do client quyết định.
# Cluster chỉ có 1 DataNode -> phải là 1 (mặc định client là 3).
spark.hadoop.dfs.replication            1

# InvoiceDate không có timezone (xem docs/02_dataset.md)
spark.sql.timestampType                 TIMESTAMP_NTZ
spark.sql.session.timeZone              UTC
